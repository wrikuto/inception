services:
  mariadb:
    build: requirements/mariadb
    env_file: .env
    networks: [intra]
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    expose: [3306]

volumes:
  mariadb_data:
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/mariadb