server {
    listen 443 ssl http2;
    server_name login.42.fr;  # または ${DOMAIN_NAME};

    # 証明書ファイルのパス (Dockerfileで生成したもの)
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # TLSv1.2 / 1.3 のみ許可
    ssl_protocols TLSv1.2 TLSv1.3;

    # 推奨暗号スイートの一例
    ssl_ciphers HIGH:!aNULL:!MD5;

    # -------------------------------------------------
    # PHP-FPM(WordPress)へのリバースプロキシ設定の例
    # -------------------------------------------------
    location / {
        # WordPressコンテナへプロキシ (例: wordpress:9000 など)
        # docker-compose で同一ネットワークにいるため、コンテナ名でアクセスできる
        proxy_pass http://wordpress:9000;
        # もしくは fastcgi で渡す場合
        # fastcgi_pass wordpress:9000;
        # fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # include fastcgi_params;
    }

    # ログ・エラー設定(任意)
    # access_log /var/log/nginx/access.log;
    # error_log /var/log/nginx/error.log;
}

# 80番ポートでのアクセスを強制的に443へリダイレクトしたい場合は、下記のように
