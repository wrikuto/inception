version: '3.8'

services:
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    # WordPressで使用するDB名・ユーザ名・パスワード等を環境変数で指定
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    # ホスト側にDBデータを永続化 (/home/<LOGIN>/data/mariadb)
    volumes:
      - /home/${LOGIN}/data/mariadb:/var/lib/mysql
    networks:
      - inception_network
    restart: always

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    depends_on:
      - mariadb
    # DBの接続情報 + WordPress用の管理者・一般ユーザ情報など
    environment:
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_NAME=${MYSQL_DATABASE}
      - WORDPRESS_DB_USER=${MYSQL_USER}
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
      # 管理者ユーザ名(例: "master" など。 "admin" が含まれない名前にする)
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD}
      - WP_USER=${WP_USER}
      - WP_USER_PASSWORD=${WP_USER_PASSWORD}
      - DOMAIN_NAME=${DOMAIN_NAME}
    # WPファイルをホスト側に永続化 (/home/<LOGIN>/data/wordpress)
    volumes:
      - /home/${LOGIN}/data/wordpress:/var/www/html
    networks:
      - inception_network
    restart: always

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    depends_on:
      - wordpress
    # ホストの443番ポート => コンテナの443番ポート
    ports:
      - "443:443"
    # WPファイルにアクセスするために同じディレクトリを共有
    volumes:
      - /home/${LOGIN}/data/wordpress:/var/www/html
      # SSL証明書や設定ファイルをホスト側に保存したい場合は以下も
      # - /home/${LOGIN}/data/nginx/conf:/etc/nginx/conf.d
      # - /home/${LOGIN}/data/nginx/ssl:/etc/nginx/ssl
    networks:
      - inception_network
    restart: always

# -----------------------------------------------------------------------------
# ネットワーク設定
# -----------------------------------------------------------------------------
networks:
  inception_network:
    driver: bridge
